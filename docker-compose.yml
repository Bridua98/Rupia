services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rupia
      MYSQL_USER: rupia
      MYSQL_PASSWORD: rupia
      MYSQL_ROOT_PASSWORD: root
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
