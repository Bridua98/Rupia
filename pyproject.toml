[project]
name = "rupia"
version = "0.1.0"
description = "Cliente web Rupia"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.3,<2",
    "mysqlclient>=2.2,<3",
    "django-crispy-forms>=2.3",
    "crispy-bootstrap5>=2025.4",
    "django-tables2>=2.8",
    "django-filter>=25.1",
    "django-autocomplete-light>=4",
    "django-htmx>=1.21",
    "django-simple-menu>=2.1,<3",
    "reportlab>=4.4,<6",
    "xhtml2pdf>=0.2.16",
    "qrcode>=7.4",
    "pillow>=10",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "gunicorn>=22,<24",
    "whitenoise>=6.6,<7",
    "boto3>=1.34",
    "schedule>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.8,<5",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rupia.settings"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "node_modules", "static", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["core", "rupia"]
