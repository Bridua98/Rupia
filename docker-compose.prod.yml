services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: rupia
      MYSQL_USER: rupia
      MYSQL_PASSWORD: rupia
      MYSQL_ROOT_PASSWORD: root
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_ENGINE: mysql
      DB_NAME: rupia
      DB_USER: rupia
      DB_PASSWORD: rupia
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - db

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  mysql_data:
