<aside class="detail-panel" aria-label="{% if panel_object %}{{ panel_object.descripcion }}{% else %}Nueva marca{% endif %}">
  <header class="detail-head">
    <div>
      <p class="eyebrow">Inventario</p>
      <h2>{% if panel_object %}{{ panel_object.descripcion }}{% else %}Nueva marca{% endif %}</h2>
    </div>
    <a class="detail-close" href="{{ close_url }}" aria-label="Cerrar"><span aria-hidden="true">×</span></a>
  </header>
  <div
    class="detail-body"
    data-rupia="ficha"
    data-list="{{ close_url }}"
    data-prev=""
    data-next=""
  >
    <form method="post" action="{{ panel_action }}" id="marca-panel-form">
      {% csrf_token %}
      <input type="hidden" name="desde" value="listado">
      {% if query %}
        <input type="hidden" name="q" value="{{ query }}">
      {% endif %}
      <div class="field{% if panel_form.descripcion.errors %} has-error{% endif %}">
        {{ panel_form.descripcion }}
        <label for="{{ panel_form.descripcion.id_for_label }}">Descripción</label>
        {% for error in panel_form.descripcion.errors %}
          <p class="field-error">{{ error }}</p>
        {% endfor %}
      </div>
    </form>
  </div>
  <footer class="detail-foot">
    <button type="submit" class="button" form="marca-panel-form" name="accion" value="guardar">Guardar</button>
    {% if ficha_url %}
      <a class="button button-ghost" href="{{ ficha_url }}">Abrir ficha</a>
    {% endif %}
  </footer>
</aside>
