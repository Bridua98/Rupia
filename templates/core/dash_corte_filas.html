{% if filas %}
  <ul class="dash-corte-list">
    {% for fila in filas %}
      <li>
        <span>{{ fila.nombre }}</span>
        <strong class="valor-gs is-texto" dir="ltr">{{ fila.importe_txt }}</strong>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="dash-empty">{{ tablero.vacio_ranking }}</p>
{% endif %}
