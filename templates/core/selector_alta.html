<div
  class="field selector has-alta"
  data-rupia="selector"
  data-create-url="{{ widget.create_url }}"
>
  {% include "core/combo.html" with nested=True %}
  <div class="selector-alta" data-selector-alta hidden>
    <p class="eyebrow">{{ widget.create_label }}</p>
    <p class="field-error" data-selector-form-error hidden></p>
    {% for field in widget.create_form.visible_fields %}
      <div class="field">
        {{ field }}
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        <p class="field-error" data-error-for="{{ field.html_name }}" hidden></p>
      </div>
    {% endfor %}
    <div class="selector-alta-actions">
      <button type="button" class="button button-compact" data-selector-guardar>Guardar</button>
      <button type="button" class="button button-ghost button-compact" data-selector-cancelar>Cancelar</button>
    </div>
  </div>
</div>
