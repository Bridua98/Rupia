<article class="dash-card dash-list">
  <p class="eyebrow">{{ titulo }}</p>
  {% if filas %}
    <ul>
      {% for fila in filas %}
        <li>
          <span>{{ fila.nombre }}</span>
          <strong class="valor-gs is-texto" dir="ltr">{{ fila.importe_txt }}</strong>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="dash-empty">Sin ventas cobradas hoy</p>
  {% endif %}
</article>
