<div class="action-menu" data-rupia="action-menu">
  <button
    type="button"
    class="action-menu-trigger"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-label="Acciones"
  >
    <svg class="action-menu-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
      <circle cx="9" cy="4.25" r="1.35" fill="currentColor"/>
      <circle cx="9" cy="9" r="1.35" fill="currentColor"/>
      <circle cx="9" cy="13.75" r="1.35" fill="currentColor"/>
    </svg>
  </button>
  <div class="action-menu-panel" role="menu" hidden>
    <ul class="action-menu-list" data-action-panel="menu">
      {% for action in actions %}
        {% if action.href %}
          <li class="action-menu-item" role="none">
            <a class="action-menu-link" role="menuitem" href="{{ action.href }}">
              {% include "core/icon.html" with name=action.icon|default:"pencil" %}
              <span>{{ action.label }}</span>
            </a>
          </li>
        {% elif action.delete_url %}
          <li class="action-menu-item action-menu-item-danger" role="none">
            <button
              type="button"
              class="action-menu-link action-menu-link-danger"
              role="menuitem"
              data-delete-trigger
              data-confirm="{{ action.confirm_message }}"
              data-action="{{ action.delete_url }}"
            >
              {% include "core/icon.html" with name=action.icon|default:"trash" %}
              <span>{{ action.label }}</span>
            </button>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
    <div class="action-menu-confirm" data-action-panel="confirm" hidden>
      <p class="action-menu-confirm-text" data-confirm-text></p>
      <form method="post" class="action-menu-confirm-form" data-delete-form>
        {% csrf_token %}
        <div class="action-menu-confirm-actions">
          <button type="submit" class="button button-danger button-compact">
            {% include "core/icon.html" with name="trash" %}
            <span>Eliminar</span>
          </button>
          <button type="button" class="button button-ghost button-compact" data-delete-cancel>
            {% include "core/icon.html" with name="x" %}
            <span>Cancelar</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
